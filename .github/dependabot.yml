version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /frontend
      - /backend
      - /shared
      - /infra
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
        update-types: [minor, patch]
      aws:
        patterns:
          - 'aws-cdk*'
          - '@aws-sdk/*'
          - 'constructs'
        update-types: [minor, patch]
      minor-and-patch:
        patterns:
          - '*'
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
        update-types: [minor, patch]
