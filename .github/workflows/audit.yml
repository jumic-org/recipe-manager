name: Dependency audit

# Dependabot alerts are not created for pnpm 12 projects, so check for known vulnerabilities here.
# This is not a PR check: a new advisory would block unrelated PRs and the merge queue.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod
