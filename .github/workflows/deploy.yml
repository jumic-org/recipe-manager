name: Deploy to AWS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  NODE_VERSION: '26'
  STACK_NAME: RecipeManagerStack

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all applications
        run: pnpm nx run-many -t build

      - name: Verify web build output
        run: pnpm verify:web

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: arn:aws:iam::352770552266:role/RecipeManagerGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy
        run: pnpm cdk deploy ${{ env.STACK_NAME }} --require-approval never
