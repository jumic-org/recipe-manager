name: Deploy PR Preview

# ── Triggers ──────────────────────────────────────────────────────────────────
# Deploy on every push to a PR branch so reviewers always see the latest code.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # One deployment per PR at a time; cancel the in-flight run if a new push arrives.
  group: deploy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write   # required for OIDC credential exchange
  contents: read
  pull-requests: write  # required to post / update the PR comment with the URL

env:
  AWS_REGION: eu-west-1
  NODE_VERSION: '26'
  MAIN_STACK_NAME: RecipeManagerStack
  PR_STACK_NAME: RecipeManagerStack-PR${{ github.event.pull_request.number }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_URL: ${{ github.event.pull_request.html_url }}

jobs:
  deploy-pr:
    name: Deploy PR #${{ github.event.pull_request.number }} Preview
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Node / pnpm ───────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build all applications
        run: pnpm nx run-many -t build

      - name: Verify web build output
        run: pnpm verify:web

      # ── AWS credentials ───────────────────────────────────────────────────────
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::352770552266:role/RecipeManagerGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}

      # ── Read Cognito IDs from the main stack outputs ──────────────────────────
      # These outputs must exist in RecipeManagerStack before PR deployments work.
      - name: Read main stack Cognito outputs
        id: main-stack
        run: |
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name "$MAIN_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text)

          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name "$MAIN_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
            --output text)

          if [[ -z "$USER_POOL_ID" || -z "$USER_POOL_CLIENT_ID" ]]; then
            echo "::error::Could not read Cognito outputs from $MAIN_STACK_NAME. Ensure the main stack is deployed."
            exit 1
          fi

          echo "userPoolId=$USER_POOL_ID"   >> "$GITHUB_OUTPUT"
          echo "userPoolClientId=$USER_POOL_CLIENT_ID" >> "$GITHUB_OUTPUT"

      # ── CDK deploy (PR stack) ─────────────────────────────────────────────────
      - name: CDK Deploy PR stack
        run: |
          pnpm cdk deploy "$PR_STACK_NAME" \
            --require-approval never \
            --context prNumber="${PR_NUMBER}" \
            --context prUrl="${PR_URL}" \
            --context mainUserPoolId="${{ steps.main-stack.outputs.userPoolId }}" \
            --context mainUserPoolClientId="${{ steps.main-stack.outputs.userPoolClientId }}"

      # ── Seed PR database from production ───────────────────────────────────────
      # Requires dynamodb:Scan on the production table and dynamodb:BatchWriteItem
      # on the PR table. See DEPLOYMENT.md for IAM policy details.
      - name: Seed PR database from production
        run: |
          # Read the production table name from the main stack outputs
          PROD_TABLE=$(aws cloudformation describe-stacks \
            --stack-name "$MAIN_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='TableName'].OutputValue" \
            --output text)

          # Read the PR table name from the PR stack outputs
          PR_TABLE=$(aws cloudformation describe-stacks \
            --stack-name "$PR_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='TableName'].OutputValue" \
            --output text)

          if [[ -z "$PROD_TABLE" || "$PROD_TABLE" == "None" ]]; then
            echo "::warning::Could not read TableName from $MAIN_STACK_NAME. Skipping seed."
            exit 0
          fi

          if [[ -z "$PR_TABLE" || "$PR_TABLE" == "None" ]]; then
            echo "::warning::Could not read TableName from $PR_STACK_NAME. Skipping seed."
            exit 0
          fi

          echo "Production table: $PROD_TABLE"
          echo "PR table: $PR_TABLE"

          TOTAL_ITEMS=0
          LAST_KEY=""

          while true; do
            # Build scan command with optional pagination token
            if [[ -z "$LAST_KEY" ]]; then
              SCAN_OUTPUT=$(aws dynamodb scan \
                --table-name "$PROD_TABLE" \
                --output json)
            else
              SCAN_OUTPUT=$(aws dynamodb scan \
                --table-name "$PROD_TABLE" \
                --exclusive-start-key "$LAST_KEY" \
                --output json)
            fi

            # Extract items from the scan result
            ITEMS=$(echo "$SCAN_OUTPUT" | jq -c '.Items')
            ITEM_COUNT=$(echo "$ITEMS" | jq 'length')

            if [[ "$ITEM_COUNT" -eq 0 ]]; then
              echo "No items found in this page."
            else
              echo "Processing $ITEM_COUNT items..."

              # Write items in batches of 25
              BATCH_START=0
              while [[ $BATCH_START -lt $ITEM_COUNT ]]; do
                BATCH_END=$((BATCH_START + 25))

                # Build the batch-write-item payload
                BATCH_PAYLOAD=$(echo "$ITEMS" | jq -c --arg table "$PR_TABLE" \
                  --argjson start "$BATCH_START" --argjson end "$BATCH_END" \
                  '{($table): [.[$start:$end][] | {PutRequest: {Item: .}}]}')

                # Write batch with retry logic for unprocessed items
                RETRIES=0
                MAX_RETRIES=3
                CURRENT_PAYLOAD="$BATCH_PAYLOAD"

                while [[ $RETRIES -le $MAX_RETRIES ]]; do
                  WRITE_OUTPUT=$(aws dynamodb batch-write-item \
                    --request-items "$CURRENT_PAYLOAD" \
                    --output json)

                  UNPROCESSED=$(echo "$WRITE_OUTPUT" | jq -c '.UnprocessedItems // {}')
                  if [[ "$UNPROCESSED" == "{}" || -z "$UNPROCESSED" ]]; then
                    break
                  fi

                  RETRIES=$((RETRIES + 1))
                  if [[ $RETRIES -gt $MAX_RETRIES ]]; then
                    echo "::error::Failed to process all items after $MAX_RETRIES retries."
                    exit 1
                  fi

                  echo "Retrying unprocessed items (attempt $RETRIES/$MAX_RETRIES)..."
                  sleep $((RETRIES * 2))
                  CURRENT_PAYLOAD="$UNPROCESSED"
                done

                BATCH_SIZE=$(echo "$ITEMS" | jq --argjson start "$BATCH_START" --argjson end "$BATCH_END" \
                  '.[$start:$end] | length')
                TOTAL_ITEMS=$((TOTAL_ITEMS + BATCH_SIZE))
                BATCH_START=$BATCH_END
              done
            fi

            # Check for pagination using LastEvaluatedKey
            LAST_KEY=$(echo "$SCAN_OUTPUT" | jq -c '.LastEvaluatedKey // empty')
            if [[ -z "$LAST_KEY" || "$LAST_KEY" == "null" ]]; then
              break
            fi
            echo "Fetching next page..."
          done

          echo "Seeding complete. Copied $TOTAL_ITEMS items from $PROD_TABLE to $PR_TABLE."

      # ── Read the CloudFront URL from the new stack ────────────────────────────
      - name: Read PR stack CloudFront URL
        id: pr-stack
        run: |
          CF_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name "$PR_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomain'].OutputValue" \
            --output text)
          echo "url=https://${CF_DOMAIN}" >> "$GITHUB_OUTPUT"

      # ── Post / update a PR comment with the preview URL ───────────────────────
      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const previewUrl = '${{ steps.pr-stack.outputs.url }}';
            const prNumber   = context.payload.pull_request.number;
            const marker     = '<!-- recipe-manager-pr-preview -->';
            const body = [
              marker,
              '## 🚀 PR Preview Deployment',
              '',
              `| | |`,
              `|---|---|`,
              `| **Preview URL** | [${previewUrl}](${previewUrl}) |`,
              `| **Stack name** | \`${{ env.PR_STACK_NAME }}\` |`,
              `| **Auto-delete** | 3 days after last deployment |`,
              '',
              '_This comment is updated on every push. The stack is deleted automatically when the PR is closed or after 3 days of inactivity._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
