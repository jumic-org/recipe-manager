name: PR title

# The squash commit on main takes its message from the PR title.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # Required for the merge queue. The job is skipped there, which counts as passing.
  merge_group:

permissions:
  pull-requests: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
